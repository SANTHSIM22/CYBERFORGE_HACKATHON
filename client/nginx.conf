# Serves the static Astro build and proxies the API on the same origin, so the
# browser never needs the API host and no CORS is involved.
# Docker DNS, re-resolved every 10 s: a restarted API container gets a new IP
# (it can even inherit the old IP of another service, e.g. api-direct), so the
# upstream must not be pinned to the address seen at nginx startup. The demo
# service is optional, so nginx must also start when it is absent.
resolver 127.0.0.11 valid=10s ipv6=off;

# Every request for one store goes to the same API copy (hash of the store in
# the URL), so with several copies a store's in-memory view and cache live in
# exactly one of them and ClickHouse is asked once per change, not once per
# copy (org dashboards likewise, by org). Requests about no single store or
# org (login, lists) are spread at random.
# Plain hash, not `hash ... consistent`: measured on nginx 1.29, `consistent`
# fell back to round robin here. So adding or removing a copy moves most
# stores; each moved store's view loads once on its new copy, with ClickHouse
# answering meanwhile.
map $uri $tp_store {
    ~^/api/v1/(?<kind>tenants|orgs)/(?<id>[^/]+)  $kind:$id;
    default                                       $request_id;
}

upstream tp_api {
    zone tp_api 64k;
    hash $tp_store;
    server api:8080 resolve;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Includes the freshness streams (/v1/tenants/{t}/stream): the API sends
    # X-Accel-Buffering: no, so each event passes through unbuffered, and a
    # keepalive comment every 20 s keeps an idle stream under proxy_read_timeout.
    location /api/ {
        proxy_pass http://tp_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # /monitor charts the direct-DB baseline (api-direct, compare/demo profiles
    # only) next to the aggregation layer. Only its stats route is exposed.
    location = /api-direct/v1/admin/stats {
        set $direct_upstream http://api-direct:8080;
        proxy_pass $direct_upstream/v1/admin/stats;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }

    location /demo/ {
        set $demo_upstream http://demo:8081;
        rewrite ^/demo/(.*)$ /$1 break;
        proxy_pass $demo_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_intercept_errors off;
    }

    location /_astro/ {
        expires 1y;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        expires -1;
    }
}
